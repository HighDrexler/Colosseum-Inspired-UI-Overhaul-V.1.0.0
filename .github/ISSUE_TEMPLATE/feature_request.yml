name: Feature request
description: Suggest a presentation or compatibility improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: Requested change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it would help
    validations:
      required: true
  - type: dropdown
    id: generation
    attributes:
      label: Applies to
      options:
        - Gen 1
        - Gen 2 / Gold
        - Both
