name: Repair v2.2.1 cart-compatible release tag

on:
  push:
    branches: [main]
    paths:
      - '.repair-v2.2.1-cart-tag'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create resolver-compatible v2.2.1 release alias
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: v.2.2.1
          TARGET_TAG: v2.2.1
          ASSET: Colosseum-Inspired-UI-Overhaul-2.2.1.zip
          EXPECTED_SHA256: 9a52b0b77caccfbee037aef4e3583685e5b069be09956f102f343ee725da0b23
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "$TARGET_TAG already exists; nothing to do."
            exit 0
          fi
          mkdir -p /tmp/ui-release
          gh release download "$SOURCE_TAG" --pattern "$ASSET" --dir /tmp/ui-release
          ACTUAL_SHA256="$(sha256sum "/tmp/ui-release/$ASSET" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL_SHA256" "$ASSET" > /tmp/ui-release/sha256sums.txt
          gh release create "$TARGET_TAG" \
            "/tmp/ui-release/$ASSET" \
            /tmp/ui-release/sha256sums.txt \
            --target main \
            --title 'Colosseum Inspired UI Overhaul v2.2.1' \
            --notes 'Resolver-compatible alias of the verified v.2.2.1 release for Gen1Recomp custom-cart installs. Asset bytes are unchanged.'
