name: Publish Colosseum UI v2.0.2

on:
  push:
    paths:
      - .github/workflows/publish-v2.0.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact 2.0.2 package bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/HighDrexler/Colosseum-Inspired-UI-Overhaul-V.1.0.0/releases/download/v2.0.0/Colosseum-Inspired-UI-Overhaul-2.0.0.zip" \
            -o colosseum_ui_overhaul-2.0.2.zip
          echo "9ab6b3fe03306dd70ad0b6673f7b7850fe3f0d732496fbab23c459a6c458347e  colosseum_ui_overhaul-2.0.2.zip" | sha256sum -c -
          sha256sum colosseum_ui_overhaul-2.0.2.zip > sha256sums.txt

      - name: Publish v2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v2.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v2.0.2 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Colosseum Inspired UI Overhaul v2.0.2" \
              --notes "Exact 2.0.2 package published for reproducible Gen1Recomp custom-cart installs. The archive bytes match the validated 2.0.2 build."
          fi
          gh release upload v2.0.2 \
            colosseum_ui_overhaul-2.0.2.zip sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
