name: Materialize exact UI 3.0.0 dev tree

on:
  push:
    branches:
      - stage/ui-3.0.0-materialize
    paths:
      - '.github/workflows/materialize-ui-3.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/ui-3.0.0-materialize
          fetch-depth: 1

      - name: Materialize and verify exact 3.0.0 payload
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO='HighDrexler/Colosseum-Overhaul-V1.0-For-Gen1Recomp-'
          SOURCE_COMMIT='c81cbd8e863b9570a339dde5706543e8086e8e93'
          RAW="https://raw.githubusercontent.com/${SOURCE_REPO}/${SOURCE_COMMIT}"
          TARGET_TREE='fe1d814d4b17da65913bad0370ee3e471004389a'

          fetch_runtime() {
            local rel="$1"
            mkdir -p "$(dirname "$rel")"
            curl --fail --silent --show-error --location "${RAW}/${rel}" --output "$rel"
          }

          # Start the large UI implementation from the exact combined source that
          # UI 3.0.0 was split from, then apply only the standalone preference/
          # identity delta. This avoids lossy reconstruction of the 1 MB Lua file.
          fetch_runtime UIMain.lua
          test "$(git hash-object UIMain.lua)" = '4fc95a2566942ec3d5d4fb6de6ed40a947263a67'
          git apply .ui3/UIMain.patch
          test "$(git hash-object UIMain.lua)" = '993924b801e70b213eb9f2492264d24def9c454e'

          cp .ui3/main.lua main.lua
          cp .ui3/manifest.json manifest.json
          cp .ui3/mod.card mod.card
          test "$(git hash-object main.lua)" = 'a2a779df0179258d4218fb982fead7708fee2b0a'
          test "$(git hash-object manifest.json)" = 'd3ab560dbfd13a583d0a4ee5abeeccbcabfe2adb'
          test "$(git hash-object mod.card)" = '9ec78c97280810289bd60b20b4b10dc801fa8104'

          for rel in \
            lib/DoublesDisplayCompat.lua \
            lib/DoublesUI.lua \
            lib/ShinySupport.lua \
            lib/UITheme.lua \
            lib/UIVisualCache.lua \
            assets/portrait_bounds.lua \
            assets/portrait_corrections/139.png \
            assets/portrait_corrections/139_shiny.png \
            assets/portrait_corrections/141.png \
            assets/portrait_corrections/141_shiny.png
          do
            fetch_runtime "$rel"
          done

          test "$(git hash-object lib/DoublesDisplayCompat.lua)" = '42348e37f886e9b88239359475892114a4806450'
          test "$(git hash-object lib/DoublesUI.lua)" = '9446e92f963e5bb5f29ba3e3bc69ed18dbefc2ad'
          test "$(git hash-object lib/ShinySupport.lua)" = '39e5595191a79774b5a2b0105e16bcdca4543077'
          test "$(git hash-object lib/UITheme.lua)" = '65f204f2691900451e9c783513e43343be7c0d6f'
          test "$(git hash-object lib/UIVisualCache.lua)" = 'af4295d2ea17c4f4acc6d298150b3412c41dae38'
          test "$(git hash-object assets/portrait_bounds.lua)" = '297b4df9a2f2d19b42a6adfbf439b624bcb7cc4a'
          test "$(git hash-object assets/portrait_corrections/139.png)" = '328a5be8d5fe84dbbde0bc0acffb5039c6bca457'
          test "$(git hash-object assets/portrait_corrections/139_shiny.png)" = '34e24ad277dabfb5837721d8802b829082839359'
          test "$(git hash-object assets/portrait_corrections/141.png)" = 'cb2e8e603da6c9d4b69950ab36bb7f48a9c7c933'
          test "$(git hash-object assets/portrait_corrections/141_shiny.png)" = 'e296962f9769df7ceb567ecdb9a6c8d80e623463'

          # Remove historical package notes and the obsolete alternate portrait
          # representations. The final dev branch intentionally ships no Markdown.
          find . -path './.git' -prune -o -type f -name '*.md' -delete
          rm -f assets/portrait_map.json
          rm -f assets/portrait_corrections/*.b64

          # Staging machinery is not part of the distributable repository.
          rm -rf .ui3 .github

          test ! -e assets/portrait_map.json
          test "$(find . -path './.git' -prune -o -type f -name '*.md' -print | wc -l)" -eq 0
          test "$(find . -path './.git' -prune -o -type f -print | wc -l)" -eq 545
          test "$(jq -r '.version' manifest.json)" = '3.0.0'
          test "$(jq -r '.id' manifest.json)" = 'colosseum_ui_overhaul'
          test -f main.lua
          test -f UIMain.lua
          test -f mod.card
          test -d lib
          test -d assets/portraits

          git add -A
          TREE="$(git write-tree)"
          echo "Candidate tree: $TREE"
          test "$TREE" = "$TARGET_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'dev: exact Colosseum UI 3.0.0 release payload'
          git push origin HEAD:stage/ui-3.0.0-materialize
