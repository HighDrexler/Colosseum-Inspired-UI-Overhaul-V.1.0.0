name: Bootstrap complete mod source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
      - 'Colosseum-Inspired-UI-Overhaul-1.0.0*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate exact verified 1.0.0 build
        id: source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'Colosseum-Inspired-UI-Overhaul-1.0.0*.zip' -size +1000k -print -quit)"
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Verify approved build byte-for-byte
        shell: bash
        run: |
          ZIP='${{ steps.source.outputs.zip }}'
          echo "20ae1f95cc48e1b3f607ae4bc4db8aa2943a22d9df35c717dcf9c9749aa380ef  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q ' main.lua$'
          unzip -l "$ZIP" | grep -q ' manifest.json$'
          unzip -l "$ZIP" | grep -q ' assets/audio/colosseum_title.ogg$'

      - name: Extract approved mod into repository root
        shell: bash
        run: |
          ZIP='${{ steps.source.outputs.zip }}'
          rm -rf /tmp/colo-mod
          mkdir -p /tmp/colo-mod
          unzip -q "$ZIP" -d /tmp/colo-mod

          rm -rf assets main.lua
          cp -a /tmp/colo-mod/main.lua ./main.lua
          cp -a /tmp/colo-mod/assets ./assets
          cp -a /tmp/colo-mod/manifest.json ./manifest.json

          for f in README.md CHANGELOG.md ARCHITECTURE.md GOLD_COMPATIBILITY.md NATIVE_SCREEN_SPEC.md; do
            if test -f "/tmp/colo-mod/$f"; then
              cp -a "/tmp/colo-mod/$f" "./$f"
            fi
          done

      - name: Validate final Gen1Recomp repository tree
        shell: bash
        run: |
          test -s main.lua
          test -s manifest.json
          test -s assets/audio/colosseum_title.ogg
          test -s assets/portrait_map.json
          test "$(find assets/portraits -type f -name '*.png' | wc -l)" -eq 530
          jq -e '.entry == "main.lua" and .version == "1.0.0"' manifest.json
          echo 'ef82c537e1e44be4548a7abfe9cdfabce3e6b116a6beda569883e20e03cbe1ea  main.lua' | sha256sum -c -

      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f Colosseum-Inspired-UI-Overhaul-1.0.0*.zip
          rm -f Colosseum-Inspired-UI-Overhaul-V.1.0.0-main.zip
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit complete functional mod repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Colosseum UI Overhaul 1.0.0 source'
          git push
