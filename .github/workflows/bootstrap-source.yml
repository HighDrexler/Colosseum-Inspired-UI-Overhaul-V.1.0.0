name: Bootstrap complete mod source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap payload
        shell: bash
        run: |
          test -f .bootstrap/READY
          compgen -G '.bootstrap/archive/part-*' >/dev/null

      - name: Restore exact verified 1.0.0 archive
        shell: bash
        run: |
          cat .bootstrap/archive/part-* | base64 -d > /tmp/Colosseum-Inspired-UI-Overhaul-1.0.0.zip
          echo '20ae1f95cc48e1b3f607ae4bc4db8aa2943a22d9df35c717dcf9c9749aa380ef  /tmp/Colosseum-Inspired-UI-Overhaul-1.0.0.zip' | sha256sum -c -
          unzip -t /tmp/Colosseum-Inspired-UI-Overhaul-1.0.0.zip

      - name: Replace repository mod tree with verified build
        shell: bash
        run: |
          rm -rf assets main.lua releases
          unzip -o /tmp/Colosseum-Inspired-UI-Overhaul-1.0.0.zip -d /tmp/colo-mod
          cp -a /tmp/colo-mod/main.lua ./main.lua
          cp -a /tmp/colo-mod/assets ./assets
          cp -a /tmp/colo-mod/manifest.json ./manifest.json
          cp -a /tmp/colo-mod/ARCHITECTURE.md ./ARCHITECTURE.md
          cp -a /tmp/colo-mod/CHANGELOG.md ./CHANGELOG.md
          cp -a /tmp/colo-mod/GOLD_COMPATIBILITY.md ./GOLD_COMPATIBILITY.md
          cp -a /tmp/colo-mod/NATIVE_SCREEN_SPEC.md ./NATIVE_SCREEN_SPEC.md
          cp -a /tmp/colo-mod/README.md ./README.md

      - name: Validate complete Gen1Recomp repository source
        shell: bash
        run: |
          test -s main.lua
          test -s manifest.json
          test -s assets/audio/colosseum_title.ogg
          test -s assets/portrait_map.json
          test "$(find assets/portraits -type f -name '*.png' | wc -l)" -eq 530
          jq -e '.entry == "main.lua" and .version == "1.0.0"' manifest.json
          echo 'ef82c537e1e44be4548a7abfe9cdfabce3e6b116a6beda569883e20e03cbe1ea  main.lua' | sha256sum -c -

      - name: Preserve verified release package
        shell: bash
        run: |
          mkdir -p releases
          cp /tmp/Colosseum-Inspired-UI-Overhaul-1.0.0.zip releases/Colosseum-Inspired-UI-Overhaul-1.0.0.zip
          sha256sum releases/Colosseum-Inspired-UI-Overhaul-1.0.0.zip > releases/Colosseum-Inspired-UI-Overhaul-1.0.0.zip.sha256

      - name: Commit functional repository source
        shell: bash
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Colosseum UI Overhaul 1.0.0 source'
          git push
