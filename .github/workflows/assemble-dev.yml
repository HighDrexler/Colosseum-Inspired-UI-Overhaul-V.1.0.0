name: Assemble exact 2.2.1 dev tree

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled-2.2.1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact main.lua
        shell: bash
        run: |
          cat .staging/main.part* > /tmp/main.lua.xz.b64
          base64 -d /tmp/main.lua.xz.b64 > /tmp/main.lua.xz
          xz -d -c /tmp/main.lua.xz > main.lua
          test "$(git hash-object main.lua)" = "65ce872b1cd136d61873b2a0d1f49ab033bcf755"
          rm -rf .staging .github

      - name: Commit exact launcher-ready dev package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "dev: exact UI 2.2.1 package [assembled-2.2.1]"
          git push origin HEAD:dev
