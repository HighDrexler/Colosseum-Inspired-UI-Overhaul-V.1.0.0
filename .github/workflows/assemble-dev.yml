name: Assemble exact 2.2.1 dev tree

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace dev with exact 2.2.1 package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/ui-2.2.1.zip \
            https://github.com/HighDrexler/Colosseum-Inspired-UI-Overhaul-V.1.0.0/releases/download/v.2.2.1/Colosseum-Inspired-UI-Overhaul-2.2.1.zip
          echo "9a52b0b77caccfbee037aef4e3583685e5b069be09956f102f343ee725da0b23  /tmp/ui-2.2.1.zip" | sha256sum -c -
          rm -rf /tmp/ui-2.2.1
          mkdir -p /tmp/ui-2.2.1
          unzip -q /tmp/ui-2.2.1.zip -d /tmp/ui-2.2.1
          test -f /tmp/ui-2.2.1/main.lua
          test -f /tmp/ui-2.2.1/manifest.json
          test "$(git hash-object /tmp/ui-2.2.1/main.lua)" = "65ce872b1cd136d61873b2a0d1f49ab033bcf755"
          python3 - <<'PY'
          import json
          with open('/tmp/ui-2.2.1/manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['version'] == '2.2.1', data.get('version')
          PY
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ui-2.2.1/. .

      - name: Commit launcher-ready dev branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dev: exact UI 2.2.1 launcher-ready package"
          git push origin HEAD:dev
