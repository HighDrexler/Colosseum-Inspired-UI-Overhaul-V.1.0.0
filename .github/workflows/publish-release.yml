name: Publish release asset

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'main.lua'
      - 'assets/**'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(jq -r '.version' manifest.json)"
          test "$VERSION" = '1.1.0'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=Colosseum-Inspired-UI-Overhaul-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate repository as a Gen1Recomp mod
        shell: bash
        run: |
          test -s manifest.json
          test -s main.lua
          test -s assets/audio/colosseum_title.ogg
          test -s assets/portrait_map.json
          test "$(find assets/portraits -type f -name '*.png' | wc -l)" -eq 530
          jq -e '.entry == "main.lua" and .version == "1.1.0"' manifest.json
          echo 'ddb67cafbe03be542cdd3228a1cac05d0eadc73978b0993cee2bf49614f59e4f  main.lua' | sha256sum -c -

      - name: Build installable release ZIP from repository source
        shell: bash
        run: |
          ASSET='${{ steps.meta.outputs.asset }}'
          zip -9 -q -r "$ASSET" \
            manifest.json main.lua assets README.md CHANGELOG.md ARCHITECTURE.md GOLD_COMPATIBILITY.md NATIVE_SCREEN_SPEC.md
          unzip -t "$ASSET"
          unzip -l "$ASSET" | grep -q ' main.lua$'
          unzip -l "$ASSET" | grep -q ' manifest.json$'
          unzip -l "$ASSET" | grep -q ' assets/audio/colosseum_title.ogg$'
          test "$(unzip -l "$ASSET" | awk '/assets\/portraits\/.*\.png$/ {n++} END {print n+0}')" -eq 530
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$TAG" --title "Colosseum Inspired UI Overhaul v$VERSION" --notes-file CHANGELOG.md --latest
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "Colosseum Inspired UI Overhaul v$VERSION" \
              --notes-file CHANGELOG.md \
              --latest
          fi
