name: Publish release asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'releases/**'
      - 'manifest.json'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=releases/Colosseum-Inspired-UI-Overhaul-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate installable ZIP
        shell: bash
        run: |
          test -f "${{ steps.version.outputs.asset }}"
          unzip -t "${{ steps.version.outputs.asset }}"
          unzip -p "${{ steps.version.outputs.asset }}" manifest.json | jq -e '.entry == "main.lua" and .version == "${{ steps.version.outputs.version }}"'
          unzip -l "${{ steps.version.outputs.asset }}" | grep -q ' main.lua$'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "Colosseum Inspired UI Overhaul v$VERSION" --notes-file CHANGELOG.md --latest
          fi
