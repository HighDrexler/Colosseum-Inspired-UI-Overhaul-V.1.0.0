name: Import verified 2.0.2 repository payload

on:
  push:
    branches: [main]
    paths:
      - '.repository-refresh-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-release-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if trigger is already gone
        id: guard
        shell: bash
        run: |
          if [ -f .repository-refresh-trigger ]; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'run=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify exact tested release asset
        if: steps.guard.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 9ab6b3fe03306dd70ad0b6673f7b7850fe3f0d732496fbab23c459a6c458347e
          ASSET: Colosseum-Inspired-UI-Overhaul-2.0.2.zip
          TAG: v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/colosseum-release
          gh release download "$TAG" --pattern "$ASSET" --dir /tmp/colosseum-release
          ACTUAL_SHA256="$(sha256sum "/tmp/colosseum-release/$ASSET" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          unzip -t "/tmp/colosseum-release/$ASSET"
          rm -rf /tmp/colosseum-payload
          mkdir -p /tmp/colosseum-payload
          unzip -q "/tmp/colosseum-release/$ASSET" -d /tmp/colosseum-payload
          test -s /tmp/colosseum-payload/main.lua
          test -s /tmp/colosseum-payload/manifest.json
          jq -e '.id == "colosseum_ui_overhaul" and .entry == "main.lua" and .version == "2.0.2" and (.games | index("gen1")) and (.games | index("gen2"))' /tmp/colosseum-payload/manifest.json
          test -s /tmp/colosseum-payload/assets/audio/colosseum_title.ogg
          test "$(find /tmp/colosseum-payload/assets/portraits -type f -name '*.png' | wc -l)" -eq 530
          test "$(find /tmp/colosseum-payload/assets/portrait_corrections -type f -name '*.png' | wc -l)" -eq 4
          test ! -e /tmp/colosseum-payload/assets/portrait_map.json
          test "$(find /tmp/colosseum-payload -type f -name '*.b64' | wc -l)" -eq 0

      - name: Replace repository payload at root
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.gitignore' \
            ! -name 'CONTRIBUTING.md' \
            ! -name 'SECURITY.md' \
            -exec rm -rf {} +
          cp -a /tmp/colosseum-payload/. .
          rm -f .repository-refresh-trigger
          test -s main.lua
          test -s manifest.json
          test -d assets
          test "$(jq -r '.version' manifest.json)" = '2.0.2'

      - name: Commit verified payload to main
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No payload changes required.'; exit 0; }
          git commit -m 'Replace repository payload with verified v2.0.2'
          git push origin HEAD:main

      - name: Verify launcher-ready repository root
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          test -s main.lua
          test -s manifest.json
          test -d assets
          test "$(jq -r '.version' manifest.json)" = '2.0.2'
          echo 'Verified: main.lua, manifest.json, and assets are direct repository-root entries.'
