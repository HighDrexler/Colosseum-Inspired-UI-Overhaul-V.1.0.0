name: Patch Gen 2 CBE trainer sprite leak

on:
  push:
    branches:
      - fix/gen2-cbe-trainer-sprite-leak
    paths:
      - '.github/workflows/patch-gen2-cbe-trainer-sprite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gen2-cbe-trainer-sprite-leak
          fetch-depth: 0

      - name: Apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/fix_gen2_cbe_trainer_sprite.py
          grep -q 'function GoldCompat.cbeOwnsEnemyTrainer' main.lua
          grep -q 'GoldCompat.cbeOwnsEnemyTrainer(state)' main.lua
          grep -q 'GoldCompat.cbeOwnsEnemyTrainer(self)' main.lua

      - name: LuaJIT compile check
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit >/dev/null
          luajit -b main.lua /tmp/colosseum-ui-gen2-cbe-trainer-fix.luac

      - name: Build test package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp main.lua dist/main.lua
          cp manifest.json dist/manifest.json
          cp -a assets dist/assets
          python3 - <<'PY'
          import json
          p='dist/manifest.json'
          with open(p,'r',encoding='utf-8') as f:
              data=json.load(f)
          data['version']='2.0.4-beta.1'
          with open(p,'w',encoding='utf-8',newline='\n') as f:
              json.dump(data,f,indent=2,ensure_ascii=False)
              f.write('\n')
          PY
          (cd dist && zip -qr ../colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip .)
          unzip -t colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip
          unzip -Z1 colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip | grep -qx 'main.lua'
          unzip -Z1 colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip | grep -qx 'manifest.json'
          unzip -Z1 colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip | grep -q '^assets/'
          sha256sum colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip > sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: colosseum-ui-2.0.4-beta.1-gen2-cbe-trainer-fix
          path: |
            colosseum_ui_overhaul-2.0.4-beta.1-gen2-cbe-trainer-fix.zip
            sha256sums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/fix_gen2_cbe_trainer_sprite.py
          rm -f .github/workflows/patch-gen2-cbe-trainer-sprite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: suppress Gen 2 trainer sprite leak while CBE owns trainer'
          git push origin HEAD:fix/gen2-cbe-trainer-sprite-leak
